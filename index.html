<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Void Cathedral — Flythrough</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0c1018; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed;
      left: 0; right: 0; bottom: 1.4rem;
      text-align: center;
      pointer-events: none;
      font-family: "Palatino Linotype", Palatino, "Times New Roman", serif;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(220, 200, 170, 0.65);
      text-shadow: 0 0 12px rgba(0, 0, 0, 0.9);
      user-select: none;
    }
    #title {
      position: fixed;
      top: 1.2rem; left: 0; right: 0;
      text-align: center;
      pointer-events: none;
      font-family: "Palatino Linotype", Palatino, "Times New Roman", serif;
      font-size: 0.95rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(200, 180, 150, 0.5);
      text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      user-select: none;
    }
    #views {
      position: fixed; bottom: 3.5rem; left: 0; right: 0;
      display: flex; justify-content: center; gap: 0.65rem;
      font: 0.875rem/1.4 system-ui, sans-serif;
    }
    #views a {
      color: #f1ddbd; background: rgba(16, 8, 24, 0.82);
      padding: 0.65rem 1rem; border: 1px solid #8b719b;
      border-radius: 2rem; text-decoration: none;
    }
    #views a:hover, #views a[aria-current="page"] { background: #412454; }
    #views a:focus-visible { outline: 2px solid #a2eaff; outline-offset: 3px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="title">Void Cathedral</div>
  <div id="hud">Follow the light · Drag to look around</div>
  <nav id="views" aria-label="Camera view">
    <a href="./">Cathedral tour</a>
    <a href="?view=orrery">View sculpture</a>
  </nav>
  <script type="module" src="./main.js"></script>
</body>
</html>
